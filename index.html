<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web to APK Pro Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }
        #terminalContainer::-webkit-scrollbar { width: 5px; }
        #terminalContainer::-webkit-scrollbar-track { background: #1a202c; }
        #terminalContainer::-webkit-scrollbar-thumb { background: #48bb78; border-radius: 5px; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-800 to-indigo-900 flex items-center justify-center p-4">

    <div class="glass-panel rounded-2xl shadow-2xl p-8 w-full max-w-md transition-all duration-500">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-2"><i class="fa-brands fa-android text-green-500"></i> App Maker Pro</h2>
            <p class="text-gray-500 text-sm">Convert Any Website to Professional App</p>
        </div>

        <div id="inputForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
                <input type="url" id="siteUrl" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="https://example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">App Name</label>
                <input type="text" id="appName" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="My Website" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">App Icon (PNG/JPG)</label>
                <input type="file" id="logoFile" accept="image/png, image/jpeg" class="w-full px-4 py-2 border rounded-lg text-sm" required>
            </div>
            <button onclick="startProcess()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg mt-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rocket"></i> Build Application
            </button>
        </div>

        <!-- Live Terminal -->
        <div id="terminalBox" class="hidden mt-6">
            <div class="bg-gray-800 rounded-t-lg px-4 py-2 flex items-center justify-between">
                <span class="text-xs text-gray-400 font-mono">Build Console</span>
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
            </div>
            <div id="terminalContainer" class="bg-gray-900 text-green-400 font-mono text-xs p-4 h-40 overflow-y-auto rounded-b-lg shadow-inner text-left leading-relaxed">
                <div id="terminalText">> Initializing connection...</div>
            </div>
        </div>

        <!-- Success & QR Section -->
        <div id="successBox" class="hidden mt-6 text-center">
            <h3 class="text-xl font-bold text-green-600 mb-2"><i class="fa-solid fa-circle-check"></i> APK is Ready!</h3>
            <p class="text-sm text-gray-600 mb-4">Your app has been successfully compiled.</p>
            
            <div id="qrCodeContainer" class="flex justify-center mb-4">
                <div class="p-2 bg-white rounded-lg shadow-md border">
                    <div id="qrcode"></div>
                    <p class="text-xs text-gray-500 mt-2 font-semibold">Scan to download on Mobile</p>
                </div>
            </div>

            <button id="downloadBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg mb-2">
                <i class="fa-solid fa-download"></i> Download APK directly
            </button>
            <button onclick="location.reload()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition">
                Create Another App
            </button>
        </div>
    </div>

    <script>
        // ================== আপনার তথ্যগুলো এখানে বসান ==================
        const IMGBB_API_KEY = 'a3b7f162039d6ecfb5980f08165110a6'; 
        const GITHUB_USERNAME = 'mrbadstudent48-dev'; // যেমন: jhondoe
        const REPO_NAME = 'apk-website'; // যেমন: apk-website
        // ===============================================================

        let terminalInterval;
        const terminalMessages = [
            "Authenticating secure connection...", "Analyzing target URL parameters...",
            "Preparing Cordova builder environment...", "Generating Android Keystore...",
            "Injecting custom UI components & icons...", "Compiling Gradle build (This takes time)...",
            "Aligning APK packages for optimization...", "Publishing to Microsoft Global CDN..."
        ];

        function pushTerminalMsg(msg) {
            const term = document.getElementById('terminalText');
            term.innerHTML += `<br>> ${msg}`;
            const container = document.getElementById('terminalContainer');
            container.scrollTop = container.scrollHeight;
        }

        function startTerminalAnimation() {
            document.getElementById('inputForm').classList.add('hidden');
            document.getElementById('terminalBox').classList.remove('hidden');
            let i = 0;
            terminalInterval = setInterval(() => {
                if(i < terminalMessages.length) { pushTerminalMsg(terminalMessages[i]); i++; }
            }, 8000);
        }

        async function startProcess() {
            const url = document.getElementById('siteUrl').value;
            const appName = document.getElementById('appName').value;
            const logoFile = document.getElementById('logoFile').files[0];

            if(!url || !appName || !logoFile) { alert("Please fill all fields and upload a logo!"); return; }

            startTerminalAnimation();

            try {
                pushTerminalMsg("[INFO] Uploading App Logo to cloud...");
                const formData = new FormData();
                formData.append('image', logoFile);
                const imgUploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const imgData = await imgUploadRes.json();
                if(!imgData.success) throw new Error("Logo upload failed!");

                pushTerminalMsg("[INFO] Triggering Serverless Build Engine...");
                const triggerRes = await fetch('/api/github', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'start_build', payload: { url, app_name: appName, icon_url: imgData.data.url } })
                });
                if (!triggerRes.ok) throw new Error("Server error!");

                setTimeout(async () => {
                    const runsRes = await fetch('/api/github', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_run_id' })
                    });
                    const runsData = await runsRes.json();
                    if(runsData.workflow_runs.length > 0) {
                        checkStatus(runsData.workflow_runs[0].id, appName);
                    }
                }, 10000);

            } catch (error) { showError(error.message); }
        }

        async function checkStatus(runId, appName) {
            const timer = setInterval(async () => {
                const res = await fetch('/api/github', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'check_status', runId: runId })
                });
                const data = await res.json();

                if (data.status === 'completed') {
                    clearInterval(timer);
                    clearInterval(terminalInterval);
                    if (data.conclusion === 'success') {
                        pushTerminalMsg("[SUCCESS] APK Published successfully!");
                        generateDirectLinkAndQR(runId, appName);
                    } else {
                        showError("Build failed on server.");
                    }
                }
            }, 15000); 
        }

        function generateDirectLinkAndQR(runId, appName) {
            // নামের মাঝখানের স্পেসগুলো ডিলিট করে URL ফ্রেন্ডলি করা হচ্ছে (YML ফাইলের মতো)
            const safeAppName = appName.replace(/[^A-Za-z0-9_-]/g, '');
            
            // ১০০% পার্মানেন্ট গিটহাব রিলিজ লিংক
            // ১০০% পার্মানেন্ট গিটহাব রিলিজ লিংক
        const directApkUrl = `https://github.com/${GITHUB_USERNAME}/${REPO_NAME}/releases/download/v${runId}/app.apk`;

            // UI পরিবর্তন ও কনফেটি এনিমেশন
            document.getElementById('terminalBox').classList.add('hidden');
            document.getElementById('successBox').classList.remove('hidden');
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899'] });

            // ইনস্ট্যান্ট QR কোড (কোনো আপলোড ছাড়াই)
            new QRCode(document.getElementById("qrcode"), { 
                text: directApkUrl, 
                width: 128, height: 128, colorDark : "#1e3a8a", colorLight : "#ffffff"
            });

            // ডাউনলোড বাটনের ফাংশন
            document.getElementById('downloadBtn').onclick = () => {
                window.location.href = directApkUrl; // সরাসরি .apk ডাউনলোড হবে
            };
        }

        function showError(msg) {
            clearInterval(terminalInterval);
            pushTerminalMsg(`[ERROR] <span class='text-red-500'>${msg}</span>`);
            setTimeout(() => { location.reload(); }, 5000);
        }
    </script>
</body>
</html>
